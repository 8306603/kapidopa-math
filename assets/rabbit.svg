<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1122" height="1402" viewBox="0 0 1122 1402">
  <defs>
    <radialGradient id="ivory" cx="50%" cy="36%" r="75%">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="0.65" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f4e5d4"/>
    </radialGradient>
    <linearGradient id="ivorySoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="1" stop-color="#f7ead9"/>
    </linearGradient>
    <linearGradient id="earPink" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff9a9d"/>
      <stop offset="0.55" stop-color="#ff858d"/>
      <stop offset="1" stop-color="#ff6973"/>
    </linearGradient>
    <linearGradient id="blush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9e9b"/>
      <stop offset="1" stop-color="#ff8089"/>
