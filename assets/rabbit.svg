    <radialGradient id="eyeBrown" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#571b0c"/>
      <stop offset="0.65" stop-color="#351006"/>
      <stop offset="1" stop-color="#260900"/>
    </radialGradient>
    <linearGradient id="mouthRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a81e34"/>
      <stop offset="1" stop-color="#6f1020"/>
