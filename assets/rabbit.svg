    <linearGradient id="neckShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4dfc9" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#d9b997" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f4dfc9" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

