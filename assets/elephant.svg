<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1100"
  height="1354"
  viewBox="0 0 1100 1354">

  <title>Little Elephant Mascot</title>
  <desc>Pure vector elephant mascot based on the supplied reference. Layered groups: head, eyes, ears, mouth, body, belly.</desc>

  <defs>
    <linearGradient id="blueMain" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9BD7FF"/>
      <stop offset="100%" stop-color="#6EB7F3"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9E5FF"/>
      <stop offset="100%" stop-color="#78C1F6"/>
    </linearGradient>
    <linearGradient id="pinkEar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD6DA"/>
      <stop offset="100%" stop-color="#FF9FAF"/>
    </linearGradient>
    <linearGradient id="pinkEarInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFADB8"/>
      <stop offset="100%" stop-color="#F57C8E"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F5F1E8"/>
    </linearGradient>
    <linearGradient id="trunkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A9DFFF"/>
      <stop offset="100%" stop-color="#67B4F1"/>
    </linearGradient>
    <linearGradient id="mouthGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#891421"/>
      <stop offset="100%" stop-color="#5E0E18"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="36%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#4C170C"/>
      <stop offset="100%" stop-color="#1E0905"/>
    </radialGradient>
  </defs>

